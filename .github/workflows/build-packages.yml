name: Build fcitx5-mcbopomofo Linux Packages

on:
  schedule:
    # 每天 UTC 04:00 (台灣時間 12:00 Asia/Taipei) 自動檢查上游新版本
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: '強制重新編譯（即使 Release 已存在）'
        type: boolean
        default: false
      target_tag:
        description: '指定上游 Tag（留空則自動抓取最新 Release）'
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.get_release.outputs.tag }}
      should_build: ${{ steps.get_release.outputs.should_build }}
    steps:
      - name: 取得上游最新 Release Tag
        id: get_release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.target_tag }}
          FORCE_BUILD: ${{ github.event.inputs.force_build }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG=$(gh release view --repo openvanilla/fcitx5-mcbopomofo --json tagName -q .tagName)
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "null" ] || [[ ! "$TAG" =~ ^[A-Za-z0-9.+~_-]+$ ]]; then
            echo "錯誤：上游 Release Tag 格式無效或為空：'$TAG'" >&2
            exit 1
          fi

          VERSION="${TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9][A-Za-z0-9.+~:-]*$ ]]; then
            echo "錯誤：轉換後版本號格式無效：'$VERSION'" >&2
            exit 1
          fi

          echo "上游目標版本：$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          if [ "$FORCE_BUILD" = "true" ]; then
            echo "已指定強制重新編譯。"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          REL_OUT=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>&1)
          REL_RC=$?
          set -e

          if [ "$REL_RC" -eq 0 ]; then
            echo "Release $TAG 已存在，跳過建置。"
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          elif echo "$REL_OUT" | grep -qE 'HTTP 404|"status":[[:space:]]*"404"|"message":[[:space:]]*"Not Found"'; then
            echo "偵測到新版本 $TAG，準備建置。"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "錯誤：檢查既有 Release 狀態失敗：$REL_OUT" >&2
            exit 1
          fi

  build-deb:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - image: 'ubuntu:22.04'
            tag: 'ubuntu22.04'
            label: 'Ubuntu 22.04'
          - image: 'ubuntu:24.04'
            tag: 'ubuntu24.04'
            label: 'Ubuntu 24.04'
          - image: 'ubuntu:26.04'
            tag: 'ubuntu26.04'
            label: 'Ubuntu 26.04'
          - image: 'debian:12'
            tag: 'debian12'
            label: 'Debian 12'
          - image: 'debian:13'
            tag: 'debian13'
            label: 'Debian 13'
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.target.image }}
    steps:
      - name: 安裝編譯與打包相依套件
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git g++ pkg-config cmake extra-cmake-modules gettext \
            dpkg-dev binutils file \
            fcitx5 libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev fcitx5-modules-dev \
            libfmt-dev libicu-dev libjson-c-dev

      - name: 下載上游指定 Tag 原始碼
        env:
          TAG: ${{ needs.check-upstream.outputs.tag }}
        run: |
          rm -rf src
          git clone --branch "$TAG" --depth 1 https://github.com/openvanilla/fcitx5-mcbopomofo.git src

      - name: CMake 編譯與 dpkg-deb 打包
        env:
          TAG: ${{ needs.check-upstream.outputs.tag }}
          DISTRO_TAG: ${{ matrix.target.tag }}
          DISTRO_LABEL: ${{ matrix.target.label }}
        run: |
          VERSION="${TAG#v}"
          ARCH="$(dpkg --print-architecture)"
          PKG_VER="${VERSION}-1~${DISTRO_TAG}"
          DEB_NAME="fcitx5-mcbopomofo_${PKG_VER}_${ARCH}.deb"

          cmake -S src -B build \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TEST=Off \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j"$(nproc)"

          rm -rf pkg shlibs
          mkdir -p pkg/DEBIAN shlibs/debian
          DESTDIR="$PWD/pkg" cmake --install build

          mapfile -t ELF_FILES < <(find "$PWD/pkg" -type f -exec sh -c 'file -b "$1" | grep -q "^ELF "' _ {} \; -print)
          if [ "${#ELF_FILES[@]}" -eq 0 ]; then
            echo "錯誤：安裝目錄中未找到任何 ELF 二進位檔或共享函式庫。" >&2
            exit 1
          fi

          strip --strip-unneeded "${ELF_FILES[@]}"

          cat > shlibs/debian/control <<EOF
          Source: fcitx5-mcbopomofo
          Section: utils
          Priority: optional
          Maintainer: fcitx5-mcbopomofo-linux <noreply@github.com>

          Package: fcitx5-mcbopomofo
          Architecture: ${ARCH}
          EOF

          SHLIBS_DEPS=$(cd shlibs && dpkg-shlibdeps -O "${ELF_FILES[@]}" | grep '^shlibs:Depends=' | sed 's/^shlibs:Depends=//')
          DEPENDS="fcitx5"
          if [ -n "$SHLIBS_DEPS" ]; then
            DEPENDS="fcitx5, ${SHLIBS_DEPS}"
          fi
          INSTALLED_SIZE=$(du -ks --exclude=DEBIAN pkg | awk '{print $1}')

          cat > pkg/DEBIAN/control <<EOF
          Package: fcitx5-mcbopomofo
          Version: ${PKG_VER}
          Section: utils
          Priority: optional
          Architecture: ${ARCH}
          Installed-Size: ${INSTALLED_SIZE}
          Depends: ${DEPENDS}
          Maintainer: fcitx5-mcbopomofo-linux <noreply@github.com>
          Homepage: https://github.com/openvanilla/fcitx5-mcbopomofo
          Description: McBopomofo Input Method for Fcitx 5
           Traditional Chinese phonetic (Bopomofo) input method engine for Fcitx 5.
           Built from openvanilla/fcitx5-mcbopomofo (${TAG}) on ${DISTRO_LABEL}.
          EOF

          chmod 0755 pkg/DEBIAN
          chmod 0644 pkg/DEBIAN/control

          mkdir -p dist
          dpkg-deb --build --root-owner-group pkg "dist/${DEB_NAME}"
          dpkg-deb --info "dist/${DEB_NAME}"
          dpkg-deb --contents "dist/${DEB_NAME}"

      - name: 套件安裝驗證
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y "./dist/"*.deb
          dpkg -s fcitx5-mcbopomofo

      - name: 上傳建置產物
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.target.tag }}
          path: dist/*.deb
          if-no-files-found: error

  build-rpm:
    needs: check-upstream
    if: needs.check-upstream.outputs.should_build == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - image: 'fedora:43'
            tag: 'fc43'
            label: 'Fedora 43'
          - image: 'fedora:44'
            tag: 'fc44'
            label: 'Fedora 44'
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.target.image }}
    steps:
      - name: 安裝編譯與 RPM 打包相依套件
        run: |
          dnf -y install \
            ca-certificates git gcc gcc-c++ binutils \
            cmake extra-cmake-modules gettext pkgconf-pkg-config rpm-build \
            fcitx5 fcitx5-devel fmt-devel libicu-devel json-c-devel

      - name: 下載上游指定 Tag 原始碼
        env:
          TAG: ${{ needs.check-upstream.outputs.tag }}
        run: |
          rm -rf src
          git clone --branch "$TAG" --depth 1 https://github.com/openvanilla/fcitx5-mcbopomofo.git src

      - name: CMake 編譯與 rpmbuild 打包
        env:
          TAG: ${{ needs.check-upstream.outputs.tag }}
          DISTRO_LABEL: ${{ matrix.target.label }}
        run: |
          VERSION="${TAG#v}"
          RPM_VER="${VERSION//-/\~}"
          if [[ ! "$RPM_VER" =~ ^[0-9][A-Za-z0-9.+~]*$ ]]; then
            echo "錯誤：RPM 版本號格式無效：'$RPM_VER'" >&2
            exit 1
          fi

          cmake -S src -B build \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TEST=Off \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j"$(nproc)"

          TOPDIR="$PWD/rpmbuild"
          BUILD_ABS="$PWD/build"
          rm -rf "$TOPDIR" dist
          mkdir -p "$TOPDIR"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS} dist

          cat > "$TOPDIR/SPECS/fcitx5-mcbopomofo.spec" <<EOF
          %global debug_package %{nil}

          Name:           fcitx5-mcbopomofo
          Version:        ${RPM_VER}
          Release:        1%{?dist}
          Summary:        McBopomofo Input Method for Fcitx 5
          License:        MIT
          URL:            https://github.com/openvanilla/fcitx5-mcbopomofo
          Requires:       fcitx5

          %description
          Traditional Chinese phonetic (Bopomofo) input method engine for Fcitx 5.
          Built from openvanilla/fcitx5-mcbopomofo (${TAG}) on ${DISTRO_LABEL}.

          %install
          rm -rf %{buildroot}
          DESTDIR="%{buildroot}" cmake --install "${BUILD_ABS}"
          find "%{buildroot}" \( -type f -o -type l \) | sed "s|^%{buildroot}||" | sort > "%{_builddir}/files.list"
          test -s "%{_builddir}/files.list"

          %files -f files.list
          EOF

          rpmbuild --define "_topdir ${TOPDIR}" -bb "$TOPDIR/SPECS/fcitx5-mcbopomofo.spec"
          cp "$TOPDIR"/RPMS/*/*.rpm dist/
          rpm -qip dist/*.rpm
          rpm -qlp dist/*.rpm
          rpm -qpR dist/*.rpm

      - name: 套件安裝驗證
        run: |
          dnf -y install ./dist/*.rpm
          rpm -qi fcitx5-mcbopomofo

      - name: 上傳建置產物
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.target.tag }}
          path: dist/*.rpm
          if-no-files-found: error

  publish-release:
    needs: [check-upstream, build-deb, build-rpm]
    if: needs.check-upstream.outputs.should_build == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: 下載所有發行版套件
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 檢查產物清單
        run: ls -lh artifacts/*.deb artifacts/*.rpm

      - name: 發布至 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-upstream.outputs.tag }}
          name: "fcitx5-mcbopomofo ${{ needs.check-upstream.outputs.tag }}"
          body: |
            自動從 [openvanilla/fcitx5-mcbopomofo](https://github.com/openvanilla/fcitx5-mcbopomofo/releases/tag/${{ needs.check-upstream.outputs.tag }}) 編譯打包之 Linux 套件。

            支援發行版：
            - **Ubuntu**：22.04 (`jammy`)、24.04 (`noble`)、26.04 (`resolute`) — 相容 Linux Mint 21/22
            - **Debian**：12 (`bookworm`)、13 (`trixie`)
            - **Fedora**：43、44

            安裝方式（請依發行版挑選對應套件）：
            ```bash
            # Ubuntu / Debian / Linux Mint
            sudo apt install ./fcitx5-mcbopomofo_*_amd64.deb

            # Fedora
            sudo dnf install ./fcitx5-mcbopomofo-*.x86_64.rpm
            ```
          files: |
            artifacts/*.deb
            artifacts/*.rpm
